<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f6f9;}
.sidebar{
width:220px;
height:100vh;
background:#222;
color:white;
position:fixed;
}
.sidebar button{
width:100%;
border:none;
padding:15px;
background:none;
color:white;
text-align:left;
}
.sidebar button:hover{background:#444;}
.content{
margin-left:220px;
padding:20px;
}
.section{display:none;}
.section.active{display:block;}
.topbar{
background:#111;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
}
</style>

</head>
<body>

<!-- TOP -->
<div class="topbar">
<h4>⚙️ Admin Panel</h4>
<button onclick="logout()" class="btn btn-danger">Çıkış</button>
</div>

<!-- MENU -->
<div class="sidebar">
<button onclick="show('orders')">📋 Siparişler</button>
<button onclick="show('products')">📦 Ürünler</button>
<button onclick="show('categories')">📂 Kategoriler</button>
<button onclick="show('tables')">🪑 Masalar</button>
<button onclick="show('finance')">💰 Ciro</button>
</div>

<!-- CONTENT -->
<div class="content">

<div id="orders" class="section active">
<h3>Siparişler</h3>
<div id="ordersList"></div>
</div>

<div id="products" class="section">
<h3>Ürün Ekle</h3>

<input id="pName" class="form-control mb-2" placeholder="Ürün adı">
<input id="pDesc" class="form-control mb-2" placeholder="Açıklama">
<input id="pPrice" class="form-control mb-2" placeholder="Fiyat">
<input id="pVat" class="form-control mb-2" placeholder="KDV %">
<input id="pImage" class="form-control mb-2" placeholder="Resim URL">

<select id="pCategory" class="form-control mb-2"></select>

<select id="pVatType" class="form-control mb-2">
<option value="included">KDV Dahil</option>
<option value="excluded">KDV Hariç</option>
</select>

<button onclick="addProduct()" class="btn btn-success">Ekle</button>

<hr>
<div id="productList"></div>
</div>

<div id="categories" class="section">
<h3>Kategori</h3>

<input id="cName" class="form-control mb-2" placeholder="Kategori adı">
<button onclick="addCategory()" class="btn btn-warning">Ekle</button>

<div id="categoryList"></div>
</div>

<div id="tables" class="section">
<h3>Masalar</h3>

<input id="tName" class="form-control mb-2" placeholder="Masa adı">
<button onclick="addTable()" class="btn btn-primary">Ekle</button>

<div id="tableList"></div>
</div>

<div id="finance" class="section">
<h3>Ciro</h3>
<p>Günlük: <span id="daily">0</span></p>
<p>Haftalık: <span id="weekly">0</span></p>
<p>Aylık: <span id="monthly">0</span></p>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr",
  storageBucket: "ruzgarguluqr.firebasestorage.app",
  messagingSenderId: "1034312304751",
  appId: "1:1034312304751:web:3b0e15ba06a937455a659a"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();
</script>

<script>

/* AUTH */
auth.onAuthStateChanged(user=>{
if(!user){
location.href="login.html";
}else{
start();
}
});

function logout(){
auth.signOut();
location.href="login.html";
}

/* NAV */
function show(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* START */
function start(){
loadProducts();
loadCategories();
loadTables();
loadOrders();
loadFinance();
}

/* PRODUCT */
function addProduct(){
db.collection("products").add({
name:pName.value,
description:pDesc.value,
price:Number(pPrice.value),
vat:Number(pVat.value),
image:pImage.value,
category:pCategory.value,
vatType:pVatType.value,
active:true
});
}

function loadProducts(){
db.collection("products").onSnapshot(s=>{
productList.innerHTML="";
s.forEach(d=>{
const p=d.data();
productList.innerHTML+=`
<div>${p.name} - ₺${p.price}
<button onclick="deleteProduct('${d.id}')">Sil</button></div>`;
});
});
}

function deleteProduct(id){
db.collection("products").doc(id).delete();
}

/* CATEGORY */
function addCategory(){
db.collection("categories").add({
name:cName.value,
active:true,
order:Date.now()
});
}

function loadCategories(){
db.collection("categories").onSnapshot(s=>{
categoryList.innerHTML="";
pCategory.innerHTML="";
s.forEach(d=>{
const c=d.data();

categoryList.innerHTML+=`<div>${c.name}</div>`;
pCategory.innerHTML+=`<option>${c.name}</option>`;
});
});
}

/* TABLE */
function addTable(){
db.collection("tables").add({name:tName.value});

const link = `menu.html?table=${tName.value}`;
alert("QR LINK: "+link);
}

function loadTables(){
db.collection("tables").onSnapshot(s=>{
tableList.innerHTML="";
s.forEach(d=>{
const t=d.data();
tableList.innerHTML+=`<div>${t.name}</div>`;
});
});
}

/* ORDERS */
function loadOrders(){
db.collection("orders").orderBy("createdAt","desc")
.onSnapshot(s=>{
ordersList.innerHTML="";
s.forEach(d=>{
const o=d.data();

ordersList.innerHTML+=`
<div class="card p-2 mb-2">
Masa: ${o.table}<br>
₺${o.total}
</div>`;
});
});
}

/* FINANCE */
function loadFinance(){
db.collection("orders").get().then(s=>{
let daily=0,weekly=0,monthly=0;

const now=new Date();

s.forEach(d=>{
const o=d.data();
if(!o.createdAt)return;

const date=o.createdAt.toDate();

const diff=(now-date)/(1000*60*60*24);

if(diff<1) daily+=o.total;
if(diff<7) weekly+=o.total;
if(date.getMonth()==now.getMonth()) monthly+=o.total;
});

daily.innerText="₺"+daily;
weekly.innerText="₺"+weekly;
monthly.innerText="₺"+monthly;

});
}

</script>

</body>
</html>
