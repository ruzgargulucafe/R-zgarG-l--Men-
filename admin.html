<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
}

.sidebar {
  width: 220px;
  background: #111;
  color: white;
  height: 100vh;
  padding: 20px;
}

.sidebar button {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  border: none;
  background: #333;
  color: white;
  cursor: pointer;
}

.content {
  flex: 1;
  padding: 20px;
}

.topbar {
  display: flex;
  justify-content: space-between;
}

input, select {
  padding: 8px;
  margin: 5px 0;
  width: 100%;
}

button.action {
  padding: 10px;
  background: green;
  color: white;
  border: none;
  margin-top: 10px;
  cursor: pointer;
}

img {
  max-width: 100px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>Admin</h3>
  <button onclick="showPage('masa')">Masalar</button>
  <button onclick="showPage('kategori')">Kategoriler</button>
  <button onclick="showPage('urun')">Ürünler</button>
  <button onclick="showPage('siparis')">Siparişler</button>
  <button onclick="showPage('ciro')">Ciro</button>
  <button onclick="logout()">Çıkış</button>
</div>

<div class="content">

<div class="topbar">
  <h2 id="title">Masalar</h2>
</div>

<div id="page"></div>

</div>

<script type="module">

// 🔥 FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr",
  storageBucket: "ruzgarguluqr.appspot.com",
  messagingSenderId: "1034312304751",
  appId: "1:1034312304751:web:3b0e15ba06a937455a659a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth();

// 🔐 LOGIN KONTROL
onAuthStateChanged(auth, user => {
  if (!user) {
    window.location.href = "index.html";
  }
});

// 🚪 LOGOUT
window.logout = () => {
  signOut(auth);
};

// SAYFA DEĞİŞTİR
window.showPage = (page) => {
  document.getElementById("title").innerText = page.toUpperCase();

  if (page === "masa") loadMasa();
  if (page === "kategori") loadKategori();
  if (page === "urun") loadUrun();
  if (page === "siparis") loadSiparis();
  if (page === "ciro") loadCiro();
};

// ================= MASA =================
function loadMasa() {
  document.getElementById("page").innerHTML = `
    <input id="masaAd" placeholder="Masa adı">
    <button class="action" onclick="masaEkle()">Ekle</button>
    <div id="qr"></div>
  `;
}

window.masaEkle = async () => {
  const masa = document.getElementById("masaAd").value;

  const link = `https://ruzgargulucafe.github.io/menu.html?table=${encodeURIComponent(masa)}`;

  QRCode.toCanvas(link, function (err, canvas) {
    document.getElementById("qr").innerHTML = "";
    document.getElementById("qr").appendChild(canvas);
  });
};

// ================= KATEGORİ =================
async function loadKategori() {
  let html = `
    <input id="katAd" placeholder="Kategori adı">
    <button class="action" onclick="kategoriEkle()">Ekle</button>
    <hr>
  `;

  const snap = await getDocs(collection(db, "categories"));

  snap.forEach(docu => {
    html += `<div>
      ${docu.data().name}
      <button onclick="kategoriSil('${docu.id}')">Sil</button>
    </div>`;
  });

  document.getElementById("page").innerHTML = html;
}

window.kategoriEkle = async () => {
  const name = document.getElementById("katAd").value;
  await addDoc(collection(db, "categories"), { name });
  showPage("kategori");
};

window.kategoriSil = async (id) => {
  await deleteDoc(doc(db, "categories", id));
  showPage("kategori");
};

// ================= ÜRÜN =================
async function loadUrun() {
  let html = `
    <input id="urunAd" placeholder="Ürün adı">
    <input id="fiyat" placeholder="Fiyat">
    <input id="kdv" placeholder="KDV %">
    <input id="resim" placeholder="Resim URL">
    <select id="kdvTip">
      <option value="dahil">KDV Dahil</option>
      <option value="haric">KDV Hariç</option>
    </select>
    <button class="action" onclick="urunEkle()">Ekle</button>
    <hr>
  `;

  const snap = await getDocs(collection(db, "products"));

  snap.forEach(d => {
    const p = d.data();
    html += `<div>
      <img src="${p.image}">
      ${p.name} - ${p.price}₺
      <button onclick="urunSil('${d.id}')">Sil</button>
    </div>`;
  });

  document.getElementById("page").innerHTML = html;
}

window.urunEkle = async () => {
  await addDoc(collection(db, "products"), {
    name: document.getElementById("urunAd").value,
    price: Number(document.getElementById("fiyat").value),
    kdv: Number(document.getElementById("kdv").value),
    type: document.getElementById("kdvTip").value,
    image: document.getElementById("resim").value
  });

  showPage("urun");
};

window.urunSil = async (id) => {
  await deleteDoc(doc(db, "products", id));
  showPage("urun");
};

// ================= SİPARİŞ =================
async function loadSiparis() {
  let html = "";

  const snap = await getDocs(collection(db, "orders"));

  snap.forEach(d => {
    const o = d.data();
    html += `<div>
      Masa: ${o.table} - ${o.total}₺
    </div>`;
  });

  document.getElementById("page").innerHTML = html;
}

// ================= CİRO =================
async function loadCiro() {
  let total = 0;

  const snap = await getDocs(collection(db, "orders"));

  snap.forEach(d => {
    total += d.data().total || 0;
  });

  document.getElementById("page").innerHTML = `
    <h3>Toplam Ciro: ${total}₺</h3>
  `;
}

// başlangıç
showPage("masa");

</script>

</body>
</html>
