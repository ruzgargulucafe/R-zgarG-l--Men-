<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f6f9;padding:20px;}
.card{margin-bottom:20px;}
</style>

</head>

<body>

<h2 class="text-center mb-4">🔥 Rüzgar Gülü Admin</h2>

<button onclick="logout()" class="btn btn-danger mb-3">Çıkış Yap</button>

<!-- SEKME MENÜ -->
<ul class="nav nav-tabs mb-4">
<li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#orders">Sipariş</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#products">Ürün</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tables">Masalar</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#finance">Ciro</button></li>
<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#debts">Borç</button></li>
</ul>

<div class="tab-content">

<!-- SİPARİŞ -->
<div class="tab-pane fade show active" id="orders">
<div id="ordersList"></div>
</div>

<!-- ÜRÜN -->
<div class="tab-pane fade" id="products">

<input id="pName" placeholder="Ürün adı" class="form-control mb-2">
<input id="pPrice" placeholder="Fiyat" class="form-control mb-2">

<button onclick="addProduct()" class="btn btn-success mb-3">Ürün Ekle</button>

<div id="productList"></div>

</div>

<!-- MASA -->
<div class="tab-pane fade" id="tables">

<input id="tableName" placeholder="Masa adı" class="form-control mb-2">

<button onclick="addTable()" class="btn btn-primary mb-3">Masa Ekle</button>

<div id="tableList"></div>

</div>

<!-- CİRO -->
<div class="tab-pane fade" id="finance">

<h4>Günlük Ciro</h4>
<div id="daily"></div>

<h4>Aylık Ciro</h4>
<div id="monthly"></div>

</div>

<!-- BORÇ -->
<div class="tab-pane fade" id="debts">

<input id="dName" placeholder="Firma" class="form-control mb-2">
<input id="dAmount" placeholder="Tutar" class="form-control mb-2">
<input id="dDate" type="date" class="form-control mb-2">

<button onclick="addDebt()" class="btn btn-warning">Borç Ekle</button>

<div id="debtList"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="admin.js"></script>

</body>
</html>
