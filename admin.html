<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rüzgar Gülü Yönetim Paneli</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#f4f6f9;
    padding:20px;

}

h1{

    text-align:center;
    margin-bottom:20px;
    color:#222;

}

#orders{

    display:flex;
    flex-direction:column;
    gap:20px;

}

.order{

    background:#fff;
    border-radius:15px;
    padding:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
    transition:.3s;

}

.order:hover{

    transform:translateY(-2px);

}

.order h2{

    margin-bottom:12px;

}

.order ul{

    margin:10px 0 15px 20px;

}

.order li{

    margin:5px 0;

}

.order p{

    margin:8px 0;

}

.durumBtn{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin-top:15px;
    background:#1976d2;
    color:white;

}

.durumBtn:hover{

    opacity:.9;

}

/* Durum Renkleri */

.order.yeni{

    background:#ffebee;
    border-left:8px solid #e53935;

}

.order.hazirlaniyor{

    background:#fff3e0;
    border-left:8px solid #fb8c00;

}

.order.hazir{

    background:#e8f5e9;
    border-left:8px solid #43a047;

}

.order.teslim{

    background:#eeeeee;
    border-left:8px solid #757575;

}

#bos{

    text-align:center;
    padding:50px;
    font-size:20px;
    color:#666;

}

@media(max-width:700px){

body{

padding:12px;

}

.order{

padding:15px;

}

}

</style>

</head>

<body>

<h1>📋 Gelen Siparişler</h1>

<div id="orders">

<div id="bos">

Henüz sipariş yok...

</div>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
