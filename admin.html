<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f6f9;}

.topbar{
background:#111;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
}

.sidebar{
width:220px;
height:100vh;
background:#222;
color:white;
position:fixed;
padding-top:70px;
}

.sidebar button{
width:100%;
border:none;
padding:15px;
background:none;
color:white;
text-align:left;
}

.sidebar button:hover{background:#444;}

.content{
margin-left:220px;
padding:20px;
}

.section{display:none;}
.section.active{display:block;}
</style>

</head>

<body>

<div class="topbar">
<h4>⚙️ Admin Panel</h4>
<button onclick="logout()" class="btn btn-danger">Çıkış</button>
</div>

<div class="sidebar">
<button onclick="show('products')">📦 Ürünler</button>
<button onclick="show('categories')">📂 Kategoriler</button>
<button onclick="show('tables')">🪑 Masalar</button>
<button onclick="show('finance')">💰 Ciro</button>
</div>

<div class="content">

<!-- ÜRÜN -->
<div id="products" class="section active">

<h3>📦 Ürünler</h3>

<input id="pName" placeholder="Ürün adı" class="form-control mb-2">
<input id="pPrice" placeholder="Fiyat" class="form-control mb-2">
<input id="pDesc" placeholder="Açıklama" class="form-control mb-2">
<input id="pKdv" placeholder="KDV (%)" class="form-control mb-2">
<input id="pImage" placeholder="Resim URL" class="form-control mb-2">

<select id="pCategory" class="form-control mb-2"></select>

<button onclick="addProduct()" class="btn btn-success mb-3">Ekle</button>

<div id="productList"></div>

</div>

<!-- KATEGORİ -->
<div id="categories" class="section">
<h3>📂 Kategoriler</h3>

<input id="cName" placeholder="Kategori adı" class="form-control mb-2">
<button onclick="addCategory()" class="btn btn-warning mb-3">Ekle</button>

<div id="categoryList"></div>
</div>

<!-- MASA -->
<div id="tables" class="section">
<h3>🪑 Masalar</h3>

<input id="tableName" placeholder="Masa adı" class="form-control mb-2">
<button onclick="addTable()" class="btn btn-primary mb-3">Ekle</button>

<div id="tableList"></div>
</div>

<!-- CİRO -->
<div id="finance" class="section">
<h3>💰 Ciro</h3>
<p>Günlük: <span id="daily">0</span></p>
<p>Aylık: <span id="monthly">0</span></p>
</div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
