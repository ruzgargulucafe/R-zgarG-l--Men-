<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<link rel="stylesheet" href="css/admin.css">
</head>

<body>

<h2>Ürün Ekle</h2>

<form id="productForm">
  <input type="text" id="name" placeholder="Ürün adı" required><br><br>

  <input type="number" id="price" placeholder="Fiyat" required><br><br>

  <input type="text" id="category" placeholder="Kategori" required><br><br>

  <input type="number" id="kdv" placeholder="KDV (%)" required><br><br>

  <textarea id="description" placeholder="Açıklama"></textarea><br><br>

  <input type="file" id="image"><br><br>

  <button type="submit">EKLE</button>
</form>

<p id="status"></p>

<script type="module" src="admin.js"></script>

</body>
</html>
