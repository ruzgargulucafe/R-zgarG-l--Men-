<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü | Rüzgar Gülü Cafe & Beach Restaurant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="menuHeader">

    <a href="index.html" class="geri">← Ana Sayfa</a>

    <h1>🍽️ MENÜ</h1>

    <p>Rüzgar Gülü Cafe & Beach Restaurant</p>

</header>

<main id="menuContainer">

    <div id="menuContent">

Yükleniyor...

</div>
</main>

<div id="cartButton">

🛒 Sepet

<span id="cartCount">0</span>

</div>
<div id="cartPanel">

    <div class="cartHeader">
        <h2>🛒 Sepetim</h2>
        <button id="closeCart">✖</button>
    </div>

    <div id="cartItems">
        <p>Henüz ürün eklenmedi.</p>
    </div>
<div class="masaSec">

    <label for="masaNo"><strong>🪑 Masa Numarası</strong></label>

    <select id="masaNo">

        <option value="">Masa Seçiniz</option>

        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
        <option>13</option>
        <option>14</option>
        <option>15</option>
        <option>16</option>
        <option>17</option>
        <option>18</option>
        <option>19</option>
        <option>20</option>

    </select>

</div>
    <div class="siparisNotu">

    <label for="orderNote">
        <strong>📝 Sipariş Notu</strong>
    </label>

    <textarea
        id="orderNote"
        placeholder="Örneğin:
Çay açık olsun,
Menemen az pişsin..."
        rows="4"></textarea>

</div>
    <div class="cartFooter">

    <h3>Toplam: <span id="cartTotal">₺0</span></h3>

    <button id="clearCart">
        🗑️ Sepeti Temizle
    </button>

    <button id="finishOrder">
        Siparişi Tamamla
    </button>

</div>

</div>
<script type="module" src="script.js"></script>

</body>

</html>
