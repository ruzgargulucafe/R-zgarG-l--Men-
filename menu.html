<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü | Rüzgar Gülü Cafe & Beach Restaurant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="menuHeader">

    <a href="index.html" class="geri">← Ana Sayfa</a>

    <h1>🍽️ MENÜ</h1>

    <p>Rüzgar Gülü Cafe & Beach Restaurant</p>

</header>

<main id="menuContainer">

<section class="kategori">

    <button class="accordion">🥐 Kahvaltılar</button>

    <div class="panel">

        <div class="urun">
            <button class="sepeteEkle"
        data-urun="Serpme Kahvaltı (2 Kişilik)"
        data-fiyat="1000">
Sepete Ekle
</button>
        </div>

        <div class="urun">
            <button class="sepeteEkle"
        data-urun="Menemen"
        data-fiyat="200">
Sepete Ekle
</button>
        </div>

        <div class="urun">
            <button class="sepeteEkle"
        data-urun="Sucuklu Yumurta"
        data-fiyat="200">
Sepete Ekle
</button>
        </div>

        <div class="urun">
            <button class="sepeteEkle"
        data-urun="Omlet"
        data-fiyat="150">
Sepete Ekle
</button>
        </div>

        <div class="urun">
            <button class="sepeteEkle"
        data-urun="Mıhlama"
        data-fiyat="250">
Sepete Ekle
</button>
        </div>

    </div>

</section>

<section class="kategori">
    <button class="accordion">🍔 Burgerler</button>
    <div class="panel">
        <p>Yakında eklenecek...</p>
    </div>
</section>

<section class="kategori">
    <button class="accordion">☕ Kahveler</button>
    <div class="panel">
        <p>Yakında eklenecek...</p>
    </div>
</section>
    
</main>

<div id="cartButton">

🛒 Sepet

<span id="cartCount">0</span>

</div>
<div id="cartPanel">

    <div class="cartHeader">
        <h2>🛒 Sepetim</h2>
        <button id="closeCart">✖</button>
    </div>

    <div id="cartItems">
        <p>Henüz ürün eklenmedi.</p>
    </div>

    <div class="cartFooter">
        <h3>Toplam: <span id="cartTotal">₺0</span></h3>

        <button id="finishOrder">
            Siparişi Tamamla
        </button>
    </div>

</div>
<script src="script.js"></script>

</body>

</html>
