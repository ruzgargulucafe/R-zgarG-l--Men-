<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>QR Menü</title>

<style>
body { font-family: Arial; padding:20px; background:#f5f5f5; }

h2 { margin-bottom:10px; }

.card {
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}

button {
  padding:10px;
  margin-top:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.add { background:green; color:white; }
.action { background:#333; color:white; }
.send { background:orange; color:white; width:100%; margin-top:15px; }

#sepet {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:15px;
  border-top:2px solid #ccc;
}
</style>
</head>

<body>

<h2 id="masa"></h2>

<button class="action" onclick="garson()">🛎 Garson Çağır</button>
<button class="action" onclick="hesap()">💳 Hesap İste</button>

<hr>

<div id="menu"></div>

<div id="sepet">
  <b>Sepet:</b>
  <div id="liste"></div>
  <h3 id="toplam">Toplam: 0₺</h3>
  <button class="send" onclick="siparis()">Siparişi Gönder</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// MASA
const masaParam = new URLSearchParams(location.search).get("table");
document.getElementById("masa").innerText = "Masa: " + masaParam;

// SEPET
let sepet = [];

// ÜRÜNLERİ YÜKLE
const snap = await getDocs(collection(db, "products"));

let html = "";

snap.forEach(d => {
  const p = d.data();

  html += `
    <div class="card">
      <b>${p.name}</b><br>
      ${p.price}₺<br>
      <button class="add" onclick="ekle('${p.name}', ${p.price})">Ekle</button>
    </div>
  `;
});

document.getElementById("menu").innerHTML = html;

// ÜRÜN EKLE
window.ekle = (name, price) => {

  const urun = sepet.find(x => x.name === name);

  if (urun) {
    urun.qty++;
  } else {
    sepet.push({ name, price, qty: 1 });
  }

  guncelle();
};

// SEPET GÜNCELLE
function guncelle() {
  let html = "";
  let toplam = 0;

  sepet.forEach(i => {
    html += `${i.name} x ${i.qty}<br>`;
    toplam += i.price * i.qty;
  });

  document.getElementById("liste").innerHTML = html;
  document.getElementById("toplam").innerText = "Toplam: " + toplam + "₺";
}

// SİPARİŞ GÖNDER
window.siparis = async () => {

  if (sepet.length === 0) {
    alert("Sepet boş");
    return;
  }

  let toplam = 0;
  sepet.forEach(i => toplam += i.price * i.qty);

  await addDoc(collection(db, "orders"), {
    table: masaParam,
    items: sepet,
    total: toplam,
    createdAt: new Date()
  });

  alert("Sipariş gönderildi");

  sepet = [];
  guncelle();
};

// GARSON
window.garson = async () => {
  await addDoc(collection(db, "calls"), {
    table: masaParam,
    createdAt: new Date()
  });

  alert("Garson geliyor");
};

// HESAP
window.hesap = async () => {
  await addDoc(collection(db, "billRequests"), {
    table: masaParam,
    createdAt: new Date()
  });

  alert("Hesap istendi");
};

</script>

</body>
</html>
