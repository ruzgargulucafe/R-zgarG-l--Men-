<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rüzgar Gülü Cafe & Beach Restaurant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-4">

    <div class="hero mb-4">

    <img
        src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600"
        class="hero-image">

    <div class="hero-overlay">

        <h1>🍃 Rüzgar Gülü</h1>

        <h4>Cafe & Beach Restaurant</h4>

        <p>
            Deniz • Kahve • Lezzet • Keyif
        </p>

    </div>

</div>

    <div id="menuContainer">

        <div class="text-center">

            <div class="spinner-border"></div>

            <p class="mt-3">
                Menü yükleniyor...
            </p>

        </div>

    </div>

</div>
<!-- Sepet Butonu -->

<button
    id="cartButton"
    class="btn btn-success rounded-pill shadow position-fixed"
    style="
        right:20px;
        bottom:20px;
        z-index:9999;
        display:none;
    ">

    🛒 Sepet
    (<span id="cartCount">0</span>)

</button>
<div
    class="position-fixed"
    style="
        right:20px;
        bottom:90px;
        z-index:9999;
    ">

    <button
        id="callWaiter"
        class="btn btn-warning rounded-pill shadow">

        🔔 Garson Çağır

    </button>

</div>
   <div
    class="position-fixed"
    style="
        right:20px;
        bottom:230px;
        z-index:9999;
    ">

    <button
        id="ordersButton"
        class="btn btn-info rounded-pill shadow">

        📦 Siparişlerim
        <span
            id="ordersCount"
            class="badge bg-danger ms-1">

            0

        </span>

    </button>

</div>
    <div
    class="position-fixed"
    style="
        right:20px;
        bottom:160px;
        z-index:9999;
    ">

    <button
        id="requestBill"
        class="btn btn-primary rounded-pill shadow">

        💳 Hesap İste

    </button>

</div>
<!-- Sepet Modal -->

<div class="modal fade" id="cartModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    🛒 Sipariş Sepeti

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div
                class="modal-body"
                id="cartItems">

                Sepet boş.

            </div>

            <div class="modal-footer">

                <h4 class="me-auto">

                    Toplam:
                    <span id="cartTotal">

                        0 ₺

                    </span>

                </h4>

                <button
                    class="btn btn-success"
                    id="sendOrder">

                    Siparişi Gönder

                </button>

            </div>

        </div>

    </div>

</div>
<!-- Siparişler Modal -->

<div class="modal fade" id="ordersModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    📦 Siparişlerim

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div
                class="modal-body"
                id="ordersContainer">

                <div class="text-center text-muted">

                    Henüz siparişiniz bulunmuyor.

                </div>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="menu.js"></script>

</body>

</html>
