<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Menü</title>

<style>
body { font-family: Arial; padding:20px; }
.item { border-bottom:1px solid #ccc; padding:10px; }
button { padding:8px; background:green; color:white; border:none; }
</style>
</head>

<body>

<h2 id="masa"></h2>
<div id="menu"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// MASA AL
const url = new URLSearchParams(window.location.search);
const masa = url.get("table");

document.getElementById("masa").innerText = "Masa: " + masa;

// MENÜ YÜKLE
const snap = await getDocs(collection(db, "products"));

let html = "";

snap.forEach(docu => {
  const p = docu.data();

  html += `
    <div class="item">
      <b>${p.name}</b><br>
      ${p.price}₺<br>
      <button onclick="siparisVer('${p.name}', ${p.price})">Sipariş Ver</button>
    </div>
  `;
});

document.getElementById("menu").innerHTML = html;

// SİPARİŞ
window.siparisVer = async (name, price) => {

  await addDoc(collection(db, "orders"), {
    table: masa,
    product: name,
    price: price,
    total: price,
    time: new Date()
  });

  alert("Sipariş gönderildi");
};

</script>

</body>
</html>
