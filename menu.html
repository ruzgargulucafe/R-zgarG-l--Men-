<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Menü</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

h2 {
  border-bottom: 2px solid black;
}

.product {
  border: 1px solid #ddd;
  padding: 10px;
  margin: 10px 0;
}

img {
  width: 100px;
}
</style>

</head>

<body>

<h1>Menü</h1>
<h3 id="masa"></h3>

<div id="menu"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 Firebase config (senin)
const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr",
  storageBucket: "ruzgarguluqr.appspot.com",
  messagingSenderId: "1034312304751",
  appId: "1:1034312304751:web:3b0e15ba06a937455a659a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🪑 MASA AL
const params = new URLSearchParams(window.location.search);
const masa = params.get("table");

document.getElementById("masa").innerText = "Masa: " + masa;

// 📦 ÜRÜNLERİ GETİR
const menuDiv = document.getElementById("menu");

const snap = await getDocs(collection(db, "products"));

snap.forEach(doc => {
  const p = doc.data();

  const div = document.createElement("div");
  div.className = "product";

  div.innerHTML = `
    <img src="${p.image}">
    <h3>${p.name}</h3>
    <p>${p.price}₺</p>
    <button onclick="siparis('${p.name}', ${p.price})">Sipariş Ver</button>
  `;

  menuDiv.appendChild(div);
});

// 🧾 SİPARİŞ
window.siparis = async (urun, fiyat) => {

  await addDoc(collection(db, "orders"), {
    table: masa,
    product: urun,
    total: fiyat,
    time: new Date()
  });

  alert("Sipariş gönderildi!");
};

</script>

</body>
</html>
