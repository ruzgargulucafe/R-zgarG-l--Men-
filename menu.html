<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü | Rüzgar Gülü Cafe & Beach Restaurant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="menuHeader">

    <a href="index.html" class="geri">← Ana Sayfa</a>

    <h1>🍽️ MENÜ</h1>

    <p>Rüzgar Gülü Cafe & Beach Restaurant</p>

</header>

<main id="menuContainer">

<section class="kategori">

    <button class="accordion">🥐 Kahvaltılar</button>

    <div class="panel">

        <div class="urun">
            <h3>Serpme Kahvaltı (2 Kişilik)</h3>
            <p>Zengin serpme kahvaltı.</p>
            <div class="fiyat">₺1.000</div>
            <button class="sepeteEkle">Sepete Ekle</button>
        </div>

        <div class="urun">
            <h3>Menemen</h3>
            <div class="fiyat">₺200</div>
            <button class="sepeteEkle">Sepete Ekle</button>
        </div>

        <div class="urun">
            <h3>Sucuklu Yumurta</h3>
            <div class="fiyat">₺200</div>
            <button class="sepeteEkle">Sepete Ekle</button>
        </div>

        <div class="urun">
            <h3>Omlet</h3>
            <div class="fiyat">₺150</div>
            <button class="sepeteEkle">Sepete Ekle</button>
        </div>

        <div class="urun">
            <h3>Mıhlama</h3>
            <div class="fiyat">₺250</div>
            <button class="sepeteEkle">Sepete Ekle</button>
        </div>

    </div>

</section>

<section class="kategori">
    <button class="accordion">🍔 Burgerler</button>
    <div class="panel">
        <p>Yakında eklenecek...</p>
    </div>
</section>

<section class="kategori">
    <button class="accordion">☕ Kahveler</button>
    <div class="panel">
        <p>Yakında eklenecek...</p>
    </div>
</section>
    
</main>

<div id="cartButton">

🛒 Sepet

<span id="cartCount">0</span>

</div>

<script src="script.js"></script>

</body>

</html>
