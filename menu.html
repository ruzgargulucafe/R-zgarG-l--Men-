<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rüzgar Gülü Cafe & Beach Restaurant</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="container py-4">

    <div class="hero mb-4">

        <img
            src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600"
            class="hero-image">

        <div class="hero-overlay">

            <h1>🍃 Rüzgar Gülü</h1>

            <h4>Cafe & Beach Restaurant</h4>

            <p>
                Deniz • Kahve • Lezzet • Keyif
            </p>

        </div>

    </div>

    <div id="menuContainer">

        <div class="text-center py-5">

            <div class="spinner-border text-success"></div>

            <p class="mt-3">

                Menü yükleniyor...

            </p>

        </div>

    </div>

</div>
    
<!-- SABİT BUTONLAR -->

<!-- 🛒 Sepet -->

<button
    id="cartButton"
    class="btn btn-success rounded-pill shadow position-fixed"
    style="
        right:20px;
        bottom:20px;
        z-index:9999;
        display:none;
    ">

    🛒 Sepet
    (<span id="cartCount">0</span>)

</button>

<!-- 🔔 Garson -->

<button
    id="callWaiter"
    class="btn btn-warning rounded-pill shadow position-fixed"
    style="
        right:20px;
        bottom:90px;
        z-index:9999;
    ">

    🔔 Garson Çağır

</button>

<!-- 💳 Hesap -->

<button
    id="requestBill"
    class="btn btn-primary rounded-pill shadow position-fixed"
    style="
        right:20px;
        bottom:160px;
        z-index:9999;
    ">

    💳 Hesap İste

</button>

<!-- 📦 Siparişler -->

<button
    id="ordersButton"
    class="btn btn-info rounded-pill shadow position-fixed"
    style="
        right:20px;
        bottom:230px;
        z-index:9999;
    ">

    📦 Siparişlerim

    <span
        id="ordersCount"
        class="badge bg-danger ms-2">

        0

    </span>

</button>    
<!-- ===========================
     SEPET MODAL
=========================== -->

<div class="modal fade" id="cartModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    🛒 Sipariş Sepeti

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div
                class="modal-body"
                id="cartItems">

                <div class="text-center text-muted py-4">

                    Sepet boş.

                </div>

            </div>

            <div class="modal-footer">

                <h4 class="me-auto">

                    Toplam:
                    <span id="cartTotal">

                        ₺0

                    </span>

                </h4>

                <button
                    id="sendOrder"
                    class="btn btn-success">

                    Siparişi Gönder

                </button>

            </div>

        </div>

    </div>

</div>

<!-- ===========================
     SİPARİŞLERİM MODAL
=========================== -->

<div class="modal fade" id="ordersModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    📦 Siparişlerim

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div
                id="ordersContainer"
                class="modal-body">

                <div class="text-center text-muted py-5">

                    Henüz siparişiniz bulunmuyor.

                </div>

            </div>

        </div>

    </div>

</div>
    <!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Menü -->

<script type="module" src="menu.js"></script>

</body>

</html>
