<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 MASA (normalize edildi)
const masa = (new URLSearchParams(location.search).get("table") || "")
  .trim()
  .toLowerCase();

document.getElementById("masa").innerText = "Masa: " + masa;

// SEPET
let sepet = [];

// ÜRÜNLER
const snap = await getDocs(collection(db,"products"));

let html = "";

snap.forEach(d=>{
  const p = d.data();

  html += `
    <div class="card">
      <b>${p.name}</b><br>
      <span>${p.price}₺</span>
      <button onclick="ekle('${p.name}', ${p.price})">Sepete Ekle</button>
    </div>
  `;
});

document.getElementById("menu").innerHTML = html;

// SEPETE EKLE
window.ekle = (name, price) => {

  const item = sepet.find(x=>x.name===name);

  if(item){
    item.qty++;
  }else{
    sepet.push({name,price,qty:1});
  }

  guncelle();
};

// SEPET GÜNCELLE
function guncelle(){

  let html="";
  let total=0;

  sepet.forEach(i=>{
    html += `${i.name} x ${i.qty}<br>`;
    total += i.price * i.qty;
  });

  document.getElementById("cartList").innerHTML = html;
  document.getElementById("total").innerText = "Toplam: " + total + "₺";
}

// SİPARİŞ GÖNDER
window.siparis = async () => {

  if(sepet.length===0){
    alert("Sepet boş");
    return;
  }

  let total=0;
  sepet.forEach(i=> total += i.price*i.qty);

  await addDoc(collection(db,"orders"),{
    table: masa, // 🔥 normalize edilmiş hali
    items: sepet,
    total: total,
    createdAt: new Date()
  });

  alert("Sipariş gönderildi");

  sepet=[];
  guncelle();
};

// GARSON
window.garson = async () => {
  await addDoc(collection(db,"calls"),{
    table: masa,
    createdAt: new Date()
  });

  alert("Garson geliyor");
};

// HESAP
window.hesap = async () => {
  await addDoc(collection(db,"billRequests"),{
    table: masa,
    createdAt: new Date()
  });

  alert("Hesap istendi");
};

// 🔥 CANLI HESAP (FIXLİ)
function hesapYukle(){

  onSnapshot(collection(db,"orders"), (snap)=>{

    let html = "";
    let total = 0;

    snap.forEach(d=>{

      const o = d.data();

      // 🔥 KRİTİK FIX
      if((o.table || "").trim().toLowerCase() !== masa) return;

      o.items.forEach(i=>{
        html += `${i.name} x${i.qty}<br>`;
        total += i.price * i.qty;
      });

    });

    document.getElementById("hesapList").innerHTML = html;
    document.getElementById("hesapTotal").innerText = "Toplam: " + total + "₺";

  });

}

hesapYukle();

</script>
