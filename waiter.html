<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garson Paneli</title>

<style>

body{

margin:0;
padding:20px;
font-family:Arial,Helvetica,sans-serif;
background:#1f1f1f;
color:white;

}

h1{

text-align:center;
margin-bottom:25px;

}

#calls{

display:flex;
flex-direction:column;
gap:20px;

}

.card{

background:#2c2c2c;
padding:20px;
border-radius:15px;
border-left:8px solid orange;

}

button{

width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:10px;
background:#28a745;
color:white;
cursor:pointer;
margin-top:15px;

}

</style>

</head>

<body>

<h1>👨‍💼 Garson Paneli</h1>
<div id="stats">

<div class="stat waiting">
<span>🍽 Bekleyen Sipariş</span>
<strong id="waitingCount">0</strong>
</div>

<div class="stat calls">
<span>🔔 Çağrı</span>
<strong id="callCount">0</strong>
</div>

<div class="stat bills">
<span>💳 Hesap</span>
<strong id="billCount">0</strong>
</div>

</div>
<h2>🔔 Garson Çağrıları</h2>

<div id="calls"></div>

<hr style="margin:40px 0;">

<h2>💳 Hesap İstekleri</h2>

<div id="bills"></div>

<script type="module" src="waiter.js"></script>

</body>

</html>
