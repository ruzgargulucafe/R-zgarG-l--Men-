<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garson Paneli</title>

<style>

body{

margin:0;
padding:20px;
font-family:Arial,Helvetica,sans-serif;
background:#1f1f1f;
color:white;

}

h1{

text-align:center;
margin-bottom:25px;

}
#stats{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:30px;

}

.stat{

padding:18px;
border-radius:12px;
text-align:center;
font-size:18px;
font-weight:bold;

}

.waiting{

background:#ff9800;

}

.calls{

background:#2196f3;

}

.bills{

background:#e91e63;

}

.stat strong{

display:block;
font-size:32px;
margin-top:8px;

}
#calls,
#bills{

display:flex;
flex-direction:column;
gap:20px;

}

.card{

background:#2c2c2c;
padding:20px;
border-radius:15px;
border-left:8px solid orange;

}

button{

width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:10px;
background:#28a745;
color:white;
cursor:pointer;
margin-top:15px;

}
#tables{

display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
gap:15px;

}

.table{

background:#333;
padding:18px;
border-radius:12px;
text-align:center;
font-size:18px;
font-weight:bold;

}
</style>

</head>

<body>

<h1>👨‍💼 Garson Paneli</h1>
<div id="stats">

<div class="stat waiting">
<span>🍽 Bekleyen Sipariş</span>
<strong id="waitingCount">0</strong>
</div>

<div class="stat calls">
<span>🔔 Çağrı</span>
<strong id="callCount">0</strong>
</div>

<div class="stat bills">
<span>💳 Hesap</span>
<strong id="billCount">0</strong>
</div>

</div>
<h2>🔔 Garson Çağrıları</h2>

<div id="calls"></div>

<hr style="margin:40px 0;">

<h2>💳 Hesap İstekleri</h2>

<div id="bills"></div>

  <hr style="margin:40px 0;">

<h2>🪑 Masalar</h2>

<div id="tables"></div>

  <!-- Adisyon Modal -->
<div id="billModal"
     style="display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.75);
            z-index:9999;
            justify-content:center;
            align-items:center;">

    <div style="
        background:#2b2b2b;
        width:min(700px,95%);
        max-height:90vh;
        overflow:auto;
        border-radius:18px;
        padding:25px;">

        <h2 id="modalTable">Masa</h2>

        <div id="modalItems"></div>

        <hr>

        <h2 style="text-align:right">
            Toplam:
            <span id="modalTotal">₺0</span>
        </h2>

        <hr>

        <h3>Ödeme Şekli</h3>

        <label>
            <input type="radio"
                   name="payment"
                   value="Nakit"
                   checked>
            Nakit
        </label>

        <br><br>

        <label>
            <input type="radio"
                   name="payment"
                   value="Kart">
            Kredi Kartı
        </label>

        <br><br>

        <label>
            <input type="radio"
                   name="payment"
                   value="Split">
            Split
        </label>

        <div id="splitArea" style="display:none;margin-top:20px;">

            <input
                id="cashAmount"
                type="number"
                placeholder="Nakit"
                style="width:100%;padding:12px;margin-bottom:10px;">

            <input
                id="cardAmount"
                type="number"
                placeholder="Kart"
                style="width:100%;padding:12px;">

        </div>

        <br>

        <button id="closeBillBtn"
                style="background:#28a745">
            💰 Hesabı Kapat
        </button>

        <button id="cancelBillBtn"
                style="background:#666">
            İptal
        </button>

    </div>

</div>
  
<script type="module" src="waiter.js"></script>

</body>

</html>
