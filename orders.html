<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sipariş Paneli</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

/* CARD */

.order{
    background:#fff;
    border-radius:15px;
    padding:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
    margin-bottom:15px;
}

/* DURUM RENK */

.order.yeni{
    background:#ffebee;
    border-left:8px solid #e53935;
}

.order.hazirlaniyor{
    background:#fff3e0;
    border-left:8px solid #fb8c00;
}

.order.teslim{
    background:#e8f5e9;
    border-left:8px solid #43a047;
}

/* BUTON */

.durumBtn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    background:#1976d2;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

</style>

</head>

<body>

<h1>📋 Siparişler</h1>

<div id="orders">
    <div class="text-center text-muted">
        Henüz sipariş yok...
    </div>
</div>

<script type="module" src="orders.js"></script>

</body>
</html>
