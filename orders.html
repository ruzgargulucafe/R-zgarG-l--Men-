<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş Paneli</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

/* CARD */

.order{
    background:#fff;
    border-radius:15px;
    padding:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
    margin-bottom:15px;
}

/* DURUM */

.yeni{ border-left:8px solid #e53935; background:#ffebee; }
.hazirlaniyor{ border-left:8px solid #fb8c00; background:#fff3e0; }
.teslim{ border-left:8px solid #43a047; background:#e8f5e9; }

/* BUTON */

.btn-action{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    font-weight:bold;
}

.btn-blue{ background:#1976d2; color:white; }
.btn-green{ background:#28a745; color:white; }
.btn-red{ background:#dc3545; color:white; }

</style>

</head>

<body>

<h1>📋 Siparişler</h1>

<div id="orders"></div>

<script type="module">

// 🔥 FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCj4F_8WOwLzVoREs-gRZDXfgYEkLtNvig",
  authDomain: "ruzgarguluqr.firebaseapp.com",
  projectId: "ruzgarguluqr"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 SİPARİŞLERİ CANLI ÇEK
onSnapshot(collection(db,"orders"), (snap)=>{

  let html = "";

  snap.forEach(d=>{

    const o = d.data();

    const status = o.status || "yeni";

    html += `
      <div class="order ${status}">
        
        <h5>Masa: ${o.table}</h5>
        
        <div>
          ${o.items?.map(i=>`${i.name} x${i.qty}`).join("<br>")}
        </div>

        <b>Toplam: ${o.total}₺</b>

        <button class="btn-action btn-blue"
        onclick="durum('${d.id}','hazirlaniyor')">
        Hazırlanıyor
        </button>

        <button class="btn-action btn-green"
        onclick="durum('${d.id}','teslim')">
        Teslim Edildi
        </button>

        <button class="btn-action btn-red"
        onclick="sil('${d.id}')">
        Sil
        </button>

      </div>
    `;
  });

  document.getElementById("orders").innerHTML = html || 
  "<div class='text-center text-muted'>Sipariş yok</div>";

});

// 🔄 DURUM GÜNCELLE
window.durum = async (id, status)=>{
  await updateDoc(doc(db,"orders",id),{
    status: status,
    updatedAt: serverTimestamp()
  });
};

// ❌ SİL
window.sil = async (id)=>{
  await deleteDoc(doc(db,"orders",id));
};

</script>

</body>
</html>
