<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kategori Yönetimi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="admin.css">

</head>

<body class="bg-light">

<div class="container-fluid">

<div class="row">

<!-- SOL MENÜ -->

<div class="col-lg-2 bg-dark text-white min-vh-100 p-4">

<h3 class="mb-4">🌊 Rüzgar Gülü</h3>

<div class="list-group">

<a href="admin.html" class="list-group-item list-group-item-action">
📦 Siparişler
</a>

<a href="products.html" class="list-group-item list-group-item-action">
🍽 Ürünler
</a>

<a href="categories.html"
class="list-group-item list-group-item-action active">
📂 Kategoriler
</a>

<a href="#"
class="list-group-item list-group-item-action">
📊 Raporlar
</a>

<a href="#"
class="list-group-item list-group-item-action">
⚙ Ayarlar
</a>

</div>

</div>

<!-- SAĞ TARAF -->

<div class="col-lg-10 p-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>Kategori Yönetimi</h2>

<button
id="newCategory"
class="btn btn-success">

➕ Yeni Kategori

</button>

</div>

<div class="row g-3 mb-4">

<div class="col-md-6">

<div class="card shadow">

<div class="card-body text-center">

<h6>Toplam Kategori</h6>

<h2 id="totalCategories">0</h2>

</div>

</div>

</div>

<div class="col-md-6">

<div class="card shadow">

<div class="card-body text-center">

<h6>Aktif Kategori</h6>

<h2 id="activeCategories">0</h2>

</div>

</div>

</div>

</div>

<input
id="searchCategory"
class="form-control mb-4"
placeholder="Kategori Ara">

<div
class="row g-4"
id="categoryList">

</div>

</div>

</div>

</div>

<!-- MODAL -->

<div
class="modal fade"
id="categoryModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h4>Kategori</h4>

<button
class="btn-close"
data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<label>Kategori Adı</label>

<input
id="categoryName"
class="form-control mb-3">

<div class="form-check">

<input
type="checkbox"
id="categoryActive"
class="form-check-input"
checked>

<label
class="form-check-label">

Aktif

</label>

</div>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

İptal

</button>

<button
id="saveCategory"
class="btn btn-success">

Kaydet

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="categories.js"></script>

</body>

</html>
