<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rüzgar Gülü Yönetim Paneli</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="d-flex">

    <!-- Sol Menü -->

    <div class="bg-dark text-white p-3 vh-100" style="width:260px;">

        <h3 class="mb-4 text-center">
            🍃 Rüzgar Gülü
        </h3>

        <div class="list-group">

            <a href="dashboard.html"
               class="list-group-item list-group-item-action active">
                🏠 Dashboard
            </a>

            <a href="products.html"
               class="list-group-item list-group-item-action">
                📦 Ürünler
            </a>

            <a href="categories.html"
               class="list-group-item list-group-item-action">
                📂 Kategoriler
            </a>

            <a href="tables.html"
               class="list-group-item list-group-item-action">
                🪑 Masalar
            </a>

            <a href="admin.html"
               class="list-group-item list-group-item-action">
                🛒 Siparişler
            </a>

        </div>

    </div>

    <!-- Sağ Taraf -->

    <div class="flex-grow-1 p-4">

        <h2 class="mb-4">
            Dashboard
        </h2>

        <div class="row g-4">

            <div class="col-md-3">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h6>📦 Ürün</h6>

                        <h2 id="productCount">
                            0
                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h6>📂 Kategori</h6>

                        <h2 id="categoryCount">
                            0
                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h6>🪑 Masa</h6>

                        <h2 id="tableCount">
                            0
                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h6>🛒 Bekleyen Sipariş</h6>

                        <h2 id="orderCount">
                            0
                        </h2>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script type="module" src="dashboard.js"></script>

</body>

</html>
