<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rüzgar Gülü Yönetim Paneli</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="admin.css">
</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-lg-2 bg-dark text-white min-vh-100 p-4">

            <h3 class="mb-4">
                🌊 Rüzgar Gülü
            </h3>

            <div class="list-group">

                <a href="admin.html"
                   class="list-group-item list-group-item-action">
                    📦 Siparişler
                </a>

                <a href="products.html"
                   class="list-group-item list-group-item-action active">
                    🍽️ Ürünler
                </a>

                <a href="#"
                   class="list-group-item list-group-item-action">
                    📊 Raporlar
                </a>

                <a href="#"
                   class="list-group-item list-group-item-action">
                    ⚙️ Ayarlar
                </a>

            </div>

        </div>

        <!-- İçerik -->

        <div class="col-lg-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>Ürün Yönetimi</h2>

                <button
                    class="btn btn-success"
                    id="newProduct">

                    ➕ Yeni Ürün

                </button>

            </div>

            <!-- Dashboard -->

            <div class="row g-3 mb-4">

                <div class="col-md-3">

                    <div class="card shadow text-center">

                        <div class="card-body">

                            <h6>Toplam Ürün</h6>

                            <h2 id="totalProducts">0</h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow text-center">

                        <div class="card-body">

                            <h6>Aktif Ürün</h6>

                            <h2 id="activeProducts">0</h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow text-center">

                        <div class="card-body">

                            <h6>Kategori</h6>

                            <h2 id="categoryCount">0</h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow text-center">

                        <div class="card-body">

                            <h6>Toplam Sipariş</h6>

                            <h2 id="orderCount">0</h2>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Arama -->

            <div class="card shadow mb-4">

                <div class="card-body">

                    <input
                        type="text"
                        id="searchProduct"
                        class="form-control"
                        placeholder="Ürün Ara...">

                </div>

            </div>

            <!-- Ürünler -->

            <div
                id="productList"
                class="row g-4">

            </div>

        </div>

    </div>

</div>

<!-- Modal -->

<div
    class="modal fade"
    id="productModal"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h4 class="modal-title">

                    Ürün Bilgileri

                </h4>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        Ürün Adı
                    </label>

                    <input
                        id="name"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Açıklama
                    </label>

                    <textarea
                        id="description"
                        rows="3"
                        class="form-control"></textarea>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">
                            Fiyat
                        </label>

                        <input
                            id="price"
                            type="number"
                            class="form-control">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Kategori
                        </label>

                        <input
                            id="category"
                            class="form-control">

                    </div>

                </div>

                <div class="mt-3">

                    <label class="form-label">
                        Fotoğraf URL
                    </label>

                    <input
                        id="image"
                        class="form-control">

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    İptal

                </button>

                <button
                    class="btn btn-success"
                    id="saveProduct">

                    Kaydet

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="products.js"></script>

</body>
</html>
