<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rüzgar Gülü Yönetim Paneli</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow">

<div class="container-fluid">

<span class="navbar-brand fw-bold">

🌊 Rüzgar Gülü Cafe & Beach Restaurant

</span>

</div>

</nav>

<div class="container-fluid">

<div class="row">

<!-- SOL MENÜ -->

<div class="col-lg-2 bg-white border-end min-vh-100 p-3">

<h5 class="mb-4">

Yönetim Paneli

</h5>

<div class="list-group">

<a href="#" class="list-group-item list-group-item-action active">

📦 Ürünler

</a>

<a href="#" class="list-group-item list-group-item-action">

🛒 Siparişler

</a>

<a href="#" class="list-group-item list-group-item-action">

📊 Dashboard

</a>

<a href="#" class="list-group-item list-group-item-action">

📈 Raporlar

</a>

<a href="#" class="list-group-item list-group-item-action">

⚙️ Ayarlar

</a>

</div>

</div>

<!-- SAĞ TARAF -->

<div class="col-lg-10 p-4">

<div class="row g-3 mb-4">

<div class="col-md-3">

<div class="card shadow-sm">

<div class="card-body text-center">

<h6>Toplam Ürün</h6>

<h2 id="totalProducts">0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card shadow-sm">

<div class="card-body text-center">

<h6>Aktif Ürün</h6>

<h2 id="activeProducts">0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card shadow-sm">

<div class="card-body text-center">

<h6>Kategori</h6>

<h2 id="categoryCount">0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card shadow-sm">

<div class="card-body text-center">

<h6>Toplam Sipariş</h6>

<h2 id="orderCount">0</h2>

</div>

</div>

</div>

</div>

<div class="card shadow">

<div class="card-body">

<div class="d-flex justify-content-between align-items-center mb-3">

<h4>

📦 Ürünler

</h4>

<button class="btn btn-success" id="newProduct">

➕ Yeni Ürün

</button>

</div>

<input

type="text"

class="form-control mb-3"

placeholder="Ürün Ara..."

id="searchProduct"

>

<div id="productList" class="row g-3">

</div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="products.js"></script>

</body>

</html>
