<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rüzgar Gülü Menü</title>

<link rel="stylesheet" href="style.css">

<style>
.top{
  text-align:center;
  padding:15px;
  background:#111;
  color:white;
}

.products{
  padding:10px;
}

.cart{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:2px solid #ccc;
  padding:10px;
}
</style>

</head>

<body>

<div class="top">
  <h2 id="masa"></h2>
</div>

<div class="products" id="menu"></div>

<div class="cart">
  <div id="cartList"></div>
  <h3 id="total">Toplam: 0₺</h3>
  <button onclick="siparis()">Siparişi Gönder</button>
</div>

<script type="module">

import { db } from "./app.js";

import {
  collection,
  getDocs,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// =========================
// MASA (QR)
// =========================

const masa = new URLSearchParams(location.search).get("table") || "Bilinmiyor";
document.getElementById("masa").innerText = "Masa: " + masa;

// =========================
// SEPET
// =========================

let cart = [];

// =========================
// ÜRÜNLER
// =========================

async function loadMenu(){

  const snap = await getDocs(collection(db,"products"));

  let html="";

  snap.forEach(d=>{
    const p = d.data();

    html += `
      <div class="card">
        <h3>${p.name}</h3>
        <p>${p.price}₺</p>
        <button onclick="ekle('${p.name}', ${p.price})">Sepete Ekle</button>
      </div>
    `;
  });

  document.getElementById("menu").innerHTML = html;
}

// =========================
// SEPET
// =========================

window.ekle = (name, price)=>{

  const item = cart.find(x=>x.name===name);

  if(item){
    item.qty++;
  }else{
    cart.push({name,price,qty:1});
  }

  renderCart();
};

function renderCart(){

  let html="";
  let total=0;

  cart.forEach(i=>{
    html += `${i.name} x${i.qty}<br>`;
    total += i.price*i.qty;
  });

  document.getElementById("cartList").innerHTML = html;
  document.getElementById("total").innerText = "Toplam: " + total + "₺";
}

// =========================
// SİPARİŞ
// =========================

window.siparis = async ()=>{

  if(cart.length===0){
    alert("Sepet boş");
    return;
  }

  let total=0;
  cart.forEach(i=> total+=i.price*i.qty);

  await addDoc(collection(db,"orders"),{
    table: masa,
    items: cart,
    total: total,
    status: "Bekliyor",
    closed: false,
    createdAt: new Date()
  });

  alert("Sipariş gönderildi");

  cart=[];
  renderCart();
};

// =========================

loadMenu();

</script>

</body>
</html>
