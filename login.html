<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Giriş</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="height:100vh;">

<div class="card p-4 text-dark" style="width:300px;">
    <h4 class="text-center mb-3">Admin Giriş</h4>

    <input id="email" class="form-control mb-2" placeholder="Email">
    <input id="password" type="password" class="form-control mb-3" placeholder="Şifre">

    <button id="loginBtn" class="btn btn-success w-100">Giriş Yap</button>

    <div id="error" class="text-danger mt-2 text-center"></div>
</div>

<script type="module" src="login.js"></script>

</body>
</html>
